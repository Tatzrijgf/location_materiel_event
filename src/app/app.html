<mat-toolbar color="primary" class="app-toolbar">
  <a class="brand" routerLink="/catalogue">LocationMatériel</a>

  <form class="search" (ngSubmit)="onSearch()">
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search-field">
      <mat-icon matPrefix>search</mat-icon>
      <input
        matInput
        placeholder="Rechercher un article..."
        name="globalSearch"
        [(ngModel)]="searchTerm"
      />
    </mat-form-field>
    <button mat-icon-button type="submit" aria-label="Rechercher">
      <mat-icon>arrow_forward</mat-icon>
    </button>
  </form>

  <span class="spacer"></span>

  @if (auth.currentUser(); as user) {
    <span class="user">{{ user.name }} — {{ user.role }}</span>
    <button mat-stroked-button type="button" (click)="logout()">Déconnexion</button>
  } @else {
    <a mat-button routerLink="/login">Connexion</a>
    <a mat-button routerLink="/register">Inscription</a>
  }
</mat-toolbar>

<nav class="app-nav">
  @for (item of visibleItems(); track item.link + item.label) {
    <a mat-button [routerLink]="item.link">{{ item.label }}</a>
  }
</nav>

<main class="page">
  <router-outlet />
</main>
